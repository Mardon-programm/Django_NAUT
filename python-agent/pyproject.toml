[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "django-naut-agent"
version = "1.0.0"
description = "DjangoNAUT agent: SQL telemetry, error interceptor and notebook shell"
requires-python = ">=3.9"
dependencies = ["Django>=3.2"]

[tool.setuptools]
packages = ["django_naut"]
